# In-memory H2 database used only during automated tests.
spring.datasource.url=jdbc:h2:mem:bookstore_test;DB_CLOSE_DELAY=-1
# H2 JDBC driver.
spring.datasource.driver-class-name=org.h2.Driver
# Default H2 username.
spring.datasource.username=sa
# H2 uses an empty password for this isolated test database.
spring.datasource.password=
# Create the schema before tests and remove it after tests.
spring.jpa.hibernate.ddl-auto=create-drop
# Hibernate dialect for H2 SQL generation.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
