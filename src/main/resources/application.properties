# Application name shown in Spring Boot logs.
spring.application.name=bookmanagement

# MySQL connection URL; environment variables can override the defaults.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookstore_db}?createDatabaseIfNotExist=true&serverTimezone=UTC
# MySQL username; root is the local-development default.
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
# JDBC driver used to connect to MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Update the schema while preserving existing rows.
spring.jpa.hibernate.ddl-auto=update
# Print SQL statements while developing.
spring.jpa.show-sql=true
# Format printed SQL for readability.
spring.jpa.properties.hibernate.format_sql=true
